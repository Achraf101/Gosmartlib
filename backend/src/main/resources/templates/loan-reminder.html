<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vergeet niet je boeken terug te brengen</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f4f5;font-family:'Trebuchet MS',Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f4f5;padding:48px 0;">
  <tr>
    <td align="center">
      <table width="580" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;">
        <tr>
          <td style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(138,30,65,0.08);">
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background:linear-gradient(135deg,#8a1e41 0%,#b8284f 100%);padding:40px 40px 40px 40px;text-align:center;">
                  <div style="font-size:48px;margin-bottom:16px;">&#9203;</div>
                  <h1 style="margin:0 0 12px 0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:28px;font-weight:700;color:#ffffff;letter-spacing:-0.5px;line-height:1.2;">Vergeet je boeken niet!</h1>
                  <p style="margin:0 0 28px 0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:14px;color:rgba(255,255,255,0.75);line-height:1.6;max-width:380px;margin-left:auto;margin-right:auto;">
                    De ontleentermijn van je boeken loopt morgen af. Breng de boeken tijdig terug, zo krijgen anderen de kans om ze te lezen.
                  </p>
                  <table cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                      <td style="background-color:#fff;border-radius:50px;padding:14px 28px;text-align:center;">
                        <p style="margin:0 0 2px 0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:10px;letter-spacing:2px;color:#aaa;text-transform:uppercase;">Terugbrengdatum</p>
                        <p style="margin:0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:22px;font-weight:700;color:#8a1e41;letter-spacing:-0.3px;">{{return_date}}</p>
                      </td>
                    </tr>
                  </table>

                </td>
              </tr>
            </table>
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:28px 40px 8px 40px;">
                  <p style="margin:0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:10px;letter-spacing:3px;color:#aaa;text-transform:uppercase;">Terug te brengen boeken</p>
                </td>
              </tr>
            </table>
            {{book_html_rows}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
