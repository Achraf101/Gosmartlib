<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="padding:12px 40px;">
      <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#faf8f9;border-radius:12px;overflow:hidden;">
        <tr>
          <td width="64" style="padding:16px 0 16px 16px;vertical-align:middle;">
            <img src="{{cover_url}}" alt="Boekomslag" width="48" height="68" style="display:block;border-radius:6px;object-fit:cover;background-color:#e8d5dc;">
          </td>
          <td style="padding:16px 16px;vertical-align:middle;">
            <p style="margin:0 0 3px 0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:15px;font-weight:700;color:#1a1a1a;">{{book_title}}</p>
            <p style="margin:0;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:12px;color:#999;">{{book_author}}</p>
          </td>
          <td width="56" style="padding:16px 16px 16px 0;vertical-align:middle;text-align:right;">
            <span style="display:inline-block;background-color:#8a1e41;color:#fff;font-family:'Trebuchet MS',Helvetica,sans-serif;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;">x{{book_amount}}</span>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
