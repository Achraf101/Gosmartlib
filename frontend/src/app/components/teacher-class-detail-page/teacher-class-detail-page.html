<app-nav-bar></app-nav-bar>
<div class="class-detail">
  <p-button
    label="Terug naar klassen"
    icon="pi pi-arrow-left"
    severity="secondary"
    (onClick)="back()"
  />
  <h1>Leerlingen</h1>

  @if (loading) {
    @for (i of [1, 2, 3, 4]; track i) {
      <p-skeleton height="3rem" styleClass="row-skeleton" />
    }
  } @else if (error) {
    <p-message severity="error" text="Leerlingen konden niet geladen worden."></p-message>
  } @else if (students.length === 0) {
    <p-message severity="info" text="Geen leerlingen in deze klas."></p-message>
  } @else {
    <p-table [value]="students" stripedRows>
      <ng-template pTemplate="header">
        <tr>
          <th>Voornaam</th>
          <th>Naam</th>
          <th>Laatste activiteit</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-s>
        <tr>
          <td>{{ s.firstName || '-' }}</td>
          <td>{{ s.lastName || '-' }}</td>
          <td>{{ s.lastActivity ? (s.lastActivity | date: 'dd/MM/yyyy') : 'Geen activiteit' }}</td>
          <td>
            <p-button
              label="Rapport bekijken"
              icon="pi pi-chart-bar"
              iconPos="right"
              (onClick)="openReport(s.id)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</div>
