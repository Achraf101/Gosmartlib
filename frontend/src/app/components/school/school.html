<app-nav-bar></app-nav-bar>
<div class="school-list">
  @for (school of schools; track school.id) {
    <div>
      <h2>{{ school.name }}</h2>
      <h3>Locaties in deze school:</h3>
      @for (location of school.locations; track location.id) {
        <p>- {{ location.name }}</p>
      }
      <div class="btns">
        <p-button [routerLink]="['/locatie/toevoegen', school.id]">Locatie toevoegen</p-button>
        <p-button [routerLink]="['/school/leerkrachten/', school.id]">Leerkrachten</p-button>
      </div>
    </div>
    <p-button
      label="Synchroniseren"
      icon="pi pi-refresh"
      severity="secondary"
      size="small"
      [loading]="syncLoading"
      (onClick)="confirmSync(school.id)"
    />
  }
  <p-button routerLink="/school/toevoegen">School toevoegen</p-button>
</div>
<p-confirmDialog></p-confirmDialog>
