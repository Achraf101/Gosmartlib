<app-nav-bar></app-nav-bar>
<div class="school-list">
  @for (school of schools; track school.id) {
    <div>
      <h2>{{ school.name }}</h2>
      <h3>Campussen in deze school:</h3>
      @for (campus of school.campuses; track campus.id) {
        <p>- {{ campus.name }}</p>
      }
      <p-button [routerLink]="['/campus/toevoegen', school.id]">Campus toevoegen</p-button>
    </div>
  }
  <p-button routerLink="/school/toevoegen">School toevoegen</p-button>
</div>
