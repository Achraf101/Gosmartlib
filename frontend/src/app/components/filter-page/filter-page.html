<app-nav-bar></app-nav-bar>
<div class="filter-container">
  <h1>Zoeken met filters</h1>

  <div class="filter-group">
    <h3>Genre</h3>
    <div class="genre-tags">
      @for (genre of genres; track genre.id) {
        <button
          class="tag-btn"
          [class.active]="isGenreSelected(genre.id)"
          (click)="toggleGenre(genre.id)">
          {{ genre.name }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group">
    <h3>Taal</h3>
    <p-select
      [(ngModel)]="selectedLanguage"
      [options]="languages"
      optionLabel="name"
      optionValue="id"
      placeholder="Alle talen"
      [showClear]="true"
      styleClass="w-full"
    />
  </div>

  <div class="filter-group">
    <h3>Fictie</h3>
    <div class="fiction-btns">
      <button class="tag-btn" [class.active]="selectedFiction === null" (click)="selectedFiction = null">Alle</button>
      <button class="tag-btn" [class.active]="selectedFiction === true" (click)="selectedFiction = true">Fictie</button>
      <button class="tag-btn" [class.active]="selectedFiction === false" (click)="selectedFiction = false">Non-fictie</button>
    </div>
  </div>

  <div class="filter-group">
    <h3>Auteur</h3>
    <p-autoComplete
      [(ngModel)]="selectedAuthors"
      [suggestions]="authorSuggestions"
      (completeMethod)="searchAuthors($event)"
      optionLabel="name"
      placeholder="Typ een auteursnaam..."
      [showClear]="true"
      [multiple]="true"
      styleClass="w-full"
    />
  </div>

  <div class="filter-group">
    <h3>CLIB niveau</h3>
    <div class="fiction-btns">
      @for (level of ['A', 'B', 'C', 'D']; track level) {
        <button class="tag-btn" [class.active]="isClibSelected(level)" (click)="toggleClib(level)">
          {{ level }}
        </button>
      }
    </div>
  </div>

  <div class="filter-group">
    <h3>Pagina's</h3>
    <div class="range-inputs">
      <input type="number" class="filter-input" placeholder="Min" [(ngModel)]="pagesMin" min="0" />
      <span>—</span>
      <input type="number" class="filter-input" placeholder="Max" [(ngModel)]="pagesMax" min="0" />
    </div>
    @if (errorPagesMin) {
      <p class="error-msg">{{ errorPagesMin }}</p>
    }
    @if (errorPagesMax) {
      <p class="error-msg">{{ errorPagesMax }}</p>
    }
  </div>

  <div class="filter-actions">
    <button class="clear-btn" (click)="clearFilters()">Wis filters</button>
    <button class="search-btn" (click)="onSearch()">
      <i class="pi pi-search"></i> Zoeken
    </button>
  </div>
</div>
