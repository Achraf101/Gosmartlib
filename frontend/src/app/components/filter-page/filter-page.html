<app-nav-bar></app-nav-bar>
<div class="filter-container">
  <h1>Zoeken met filters</h1>


  <div class="filter-group">
    <h3>Genre</h3>
    <div class="genre-tags">
      <button
        *ngFor="let genre of genres"
        class="tag-btn"
        [class.active]="isGenreSelected(genre.id)"
        (click)="toggleGenre(genre.id)">
        {{ genre.name }}
      </button>
    </div>
  </div>


  <div class="filter-group">
    <h3>Taal</h3>
    <select class="filter-select" [(ngModel)]="selectedLanguage">
      <option [ngValue]="null">Alle talen</option>
      <option *ngFor="let lang of languages" [ngValue]="lang.id">{{ lang.name }}</option>
    </select>
  </div>


  <div class="filter-group">
    <h3>Fictie</h3>
    <div class="fiction-btns">
      <button class="tag-btn" [class.active]="selectedFiction === null" (click)="selectedFiction = null">Alle</button>
      <button class="tag-btn" [class.active]="selectedFiction === true" (click)="selectedFiction = true">Fictie</button>
      <button class="tag-btn" [class.active]="selectedFiction === false" (click)="selectedFiction = false">Non-fictie</button>
    </div>
  </div>


  <div class="filter-group">
    <h3>Auteur</h3>
    <select class="filter-select" [(ngModel)]="selectedAuthor">
      <option [ngValue]="null">Alle auteurs</option>
      <option *ngFor="let author of authors" [ngValue]="author.id">{{ author.name }}</option>
    </select>
  </div>


  <div class="filter-group">
    <h3>Leeftijd</h3>
    <div class="range-inputs">
      <input type="number" class="filter-input" placeholder="Min" [(ngModel)]="ageMin" min="0" />
      <span>—</span>
      <input type="number" class="filter-input" placeholder="Max" [(ngModel)]="ageMax" min="0" />
    </div>
  </div>


  <div class="filter-group">
    <h3>Pagina's</h3>
    <div class="range-inputs">
      <input type="number" class="filter-input" placeholder="Min" [(ngModel)]="pagesMin" min="0" />
      <span>—</span>
      <input type="number" class="filter-input" placeholder="Max" [(ngModel)]="pagesMax" min="0" />
    </div>
  </div>

  <div class="filter-actions">
    <button class="clear-btn" (click)="clearFilters()">Wis filters</button>
    <button class="search-btn" (click)="onSearch()">
      <i class="pi pi-search"></i> Zoeken
    </button>
  </div>
</div>
