<p-toast></p-toast>

<section class="spotlight-section">
  <div class="section-tabs">
    <button
      class="tab"
      *ngFor="let section of sections"
      [class.active]="activeSection?.id === section.id"
      (click)="selectSection(section)"
    >
      {{ section.title }}
    </button>
  </div>

  <!-- In de kijker: grid van boeken -->
  <div class="books-grid" *ngIf="!isMonthlySection && activeSection && books.length > 0">
    <div class="book-card" *ngFor="let book of books" [routerLink]="['/boek', book.id]">
      <b-card [bookCard]="book" size="large"></b-card>
    </div>
  </div>

  @if (isMonthlySection) {
    <div class="monthly-header">
      <p-select
        [(ngModel)]="selectedGrade"
        [options]="grades"
        optionLabel="label"
        optionValue="value"
        (onChange)="onGradeChange()"
        styleClass="grade-select"
      />
      <p-button
        label="Wijzig boek"
        icon="pi pi-pencil"
        severity="secondary"
        (onClick)="changeBookOfMonth()"
      />
    </div>

    @if (monthlyBook) {
      <b-result [book]="monthlyBook"></b-result>
    } @else {
      <div class="empty-msg">Geen boek van de maand ingesteld voor deze graad.</div>
    }
  }

  <div class="empty-msg" *ngIf="!isMonthlySection && books.length === 0">Geen boeken gevonden.</div>
</section>
