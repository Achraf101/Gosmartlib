<div
  class="book-card {{ size }}"
  [routerLink]="bookCard.id ? '/boek/' + bookCard.id : null"
  (click)="bookCard.id && scrollTop()"
>
  <div class="book-cover">
    <b-cover [bookInput]="bookCard"></b-cover>
  </div>
  <p class="title">{{ bookCard.title }}</p>
  <p class="author">{{ bookCard.author.name }}</p>
</div>
