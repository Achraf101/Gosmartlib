<form class="search-bar" (submit)="$event.preventDefault(); onSearch()">
  <input
    type="text"
    class="search-input"
    placeholder="Zoek op titel, auteur, genre, thema, ISBN,..."
    [(ngModel)]="query"
    name="search"
  />
  @if (query) {
    <button type="button" class="search-btn" (click)="onDelete()">
      <i class="pi pi-times"></i>
    </button>
  }
  <button type="submit" class="search-btn">
    <i class="pi pi-search"></i>
  </button>
</form>
