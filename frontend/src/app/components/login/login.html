<div class="login-container">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="login-header">
        <img src="assets/logo.png" alt="GO! Antwerpen" class="login-logo" />
      </div>
    </ng-template>

    <h2 class="login-title">Inloggen</h2>

    @if (errorMessage) {
      <p-message severity="error" [style]="{ 'margin-bottom': '1rem' }">{{
        errorMessage
      }}</p-message>
      <br />
    }
    <a class="ss-btn" href="{{ smartschoolUrl }}">
      <img src="assets/smartschool-login.png" alt="Inloggen met Smartschool" />
    </a>
    <p-accordion>
      <p-accordion-panel value="0">
        <p-accordion-header></p-accordion-header>
        <p-accordion-content>
          <form (ngSubmit)="onSubmit()" class="login-form">
            <label for="username">Gebruikersnaam</label>
            <input
              id="username"
              pInputText
              type="text"
              [(ngModel)]="username"
              name="username"
              autocomplete="username"
              fluid
            />

            <label for="password">Wachtwoord</label>

            <p-password
              id="password"
              name="password"
              [(ngModel)]="password"
              [toggleMask]="true"
              [feedback]="false"
              autocomplete="password"
              fluid
            />
            <p-button
              class="btn"
              type="submit"
              label="Inloggen"
              [loading]="loading"
              [style]="{
                'background-color': '#7a1e2e',
                'border-color': '#7a1e2e',
                width: '100%',
                'margin-top': '0.5rem',
              }"
            />
          </form>
        </p-accordion-content>
      </p-accordion-panel>
    </p-accordion>
  </p-card>
</div>
