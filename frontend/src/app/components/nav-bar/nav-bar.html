<header class="header">
  <div class="header-left">
    <img src="assets/logo.png" alt="GO! Antwerpen" class="logo" />
  </div>
  <div class="header-right">
    <button class="icon-btn">
      <i class="pi pi-bell" style="font-size: 1.2rem"></i>
    </button>
    <div class="user-info">
      <i class="pi pi-user"></i>
      <span>John Smith</span>
    </div>
  </div>
</header>

<nav class="nav">
  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="nav-link"
    >Startpagina</a
  >
  <a routerLink="/catalogus" routerLinkActive="active" class="nav-link">Catalogus</a>
  <a routerLink="/boek/toevoegen" routerLinkActive="active" class="nav-link">Boek toevoegen</a>
  <a routerLink="/uitleningen" routerLinkActive="active" class="nav-link">Mijn uitleningen</a>
  <a routerLink="/leeslijst" routerLinkActive="active" class="nav-link"
    >Mijn leeslijst &amp; favorieten</a
  >
</nav>
