<header class="header">
  <div class="header-left">
    <img src="assets/logo.png" alt="GO! Antwerpen" class="logo" routerLink="/" />
  </div>
  <div class="header-right">
    <button class="icon-btn hide-mobile">
      <i class="pi pi-bell" style="font-size: 1.2rem"></i>
    </button>
    @if (authService.currentUser$ | async; as user) {
      <div class="user-info">
        <app-loan-cart />
        <i class="pi pi-user hide-mobile"></i>
        <span class="username">{{ user.username }}</span>
      </div>
      <button class="icon-btn" (click)="logout()" title="Uitloggen">
        <i class="pi pi-sign-out" style="font-size: 1.2rem"></i>
      </button>
    }
    <button class="icon-btn hamburger-btn" (click)="toggleMenu()" aria-label="Menu openen">
      <i class="pi" [class.pi-bars]="!menuOpen" [class.pi-times]="menuOpen" style="font-size: 1.2rem"></i>
    </button>
  </div>
</header>

<nav class="nav" [class.open]="menuOpen">
  <a
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
    class="nav-link"
    (click)="menuOpen = false"
    >Startpagina</a
  >
  <a routerLink="/catalogus" routerLinkActive="active" class="nav-link" (click)="menuOpen = false">Catalogus</a>
  <a routerLink="/uitleningen" routerLinkActive="active" class="nav-link" (click)="menuOpen = false">Mijn uitleningen</a>
  <a routerLink="/favorieten" routerLinkActive="active" class="nav-link" (click)="menuOpen = false"
    >Mijn leeslijst &amp; favorieten</a
  >
  @if (authService.hasRole('BIBLIOTHEEKBEHEERDER')) {
    <a routerLink="/dashboard/bibliotheek-beheerder" routerLinkActive="active" class="nav-link" (click)="menuOpen = false"
      >Dashboard</a
    >
  }
  @if (authService.hasRole('LEERKRACHT')) {
    <a routerLink="/leerkracht/klassen" routerLinkActive="active" class="nav-link" (click)="menuOpen = false">Mijn klassen</a>
  }
</nav>
