server {
    # redirect http to https
    listen 80;
    server_name gosmartlib.tech;


    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    #return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name gosmartlib.tech;

    http2 on;
    http3 on;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;


    server_tokens off;
    etag off;
    add_header Access-Control-Allow-Origin "https://gosmartlib.tech" always;
    add_header X-Frame-Options DENY always;

    ssl_certificate     /etc/letsencrypt/live/gosmartlib.tech/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/gosmartlib.tech/privkey.pem;

    gzip on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    index index.html;


    location /api/ {
        client_max_body_size 10M;
        proxy_pass http://backend:8080;
    }


    location / {
        add_header Last-Modified '';
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # cover filename changes when new is uploaded
    location /static/cover/ {
		add_header Last-Modified '';
        add_header Cache-Control 'public, max-age 31536000, immutable';
		alias /var/www/static/cover/;
	}

    location ~ "^/static/file/(?<id>[a-f0-9]{32})/(?<filename>[^/]+)$" {
        alias /var/www/static/file/$id;

        add_header Content-Disposition "attachment; filename=\"$filename\"";
    }
}

