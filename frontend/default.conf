server {
    # redirect http to https
    listen 80;
    server_name gosmartlib.tech;


    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gosmartlib.tech;

    server_tokens off;
    add_header Access-Control-Allow-Origin "https://gosmartlib.tech" always;
    add_header X-Frame-Options DENY always;

    ssl_certificate     /etc/letsencrypt/live/gosmartlib.tech/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/gosmartlib.tech/privkey.pem;

    gzip on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    index index.html;


    location /api/ {
        proxy_pass http://backend:8080;
        # optimalisation
        keepalive 64;
    }


    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # cover filename changes when new is uploaded
    location /static/cover/ {
		expires 1y;
		alias /var/www/static/cover/;
	}
}

