server {
    # redirect http to https
    listen 80;
    server_name gosmartlib.tech;


    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name gosmartlib.tech;

    ssl_certificate     /etc/letsencrypt/live/gosmartlib.tech/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/gosmartlib.tech/privkey.pem;

    gzip on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml;

    index index.html;

    root /usr/share/nginx/html;


    location /api/ {
        proxy_pass http://backend:8080;
    }


    location / {
        try_files $uri index.html;
    }

    
}

