info:
  name: Add school
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/school
  body:
    type: json
    data: |-
      {
        "name": "Green Valley School",
        "adres": "123 Main Street",
        "contact": "info@greenvalley.com",
        "description": "Private secondary school"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
