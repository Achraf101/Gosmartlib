info:
  name: Add book
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/book
  body:
    type: json
    data: |-
      {
              "title": "something titly",
        "fiction": true,
        "bookType": 1,
        "language": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
