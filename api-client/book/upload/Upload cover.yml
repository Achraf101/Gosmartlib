info:
  name: Upload cover
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8080/api/upload/cover
  body:
    type: multipart-form
    data:
      - name: book_id
        type: text
        value: "2"
      - name: file
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
