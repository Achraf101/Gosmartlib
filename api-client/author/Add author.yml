info:
  name: Add author
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/author
  body:
    type: json
    data: |-
      {
        "name": "George",
        "description": "really Famous books...       "
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
