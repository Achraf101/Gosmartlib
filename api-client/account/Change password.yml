info:
  name: Change password
  type: http
  seq: 1

http:
  method: PUT
  url: http://localhost:8080/api/account/password
  body:
    type: json
    data: |-
      {
        "current_password": "Admin123",
        "new_password": "Admin"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
