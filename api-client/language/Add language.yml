info:
  name: Add language
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/language
  body:
    type: json
    data: |-
      {
        "name": "Engels",
        "code": "en"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
